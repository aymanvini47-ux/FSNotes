name: Build FSNotes IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack source
        run: |
          unzip -q FSNotes-Open-Filza-GitHub-Package.zip
          cd fsnotes-master
          xcodebuild -project "FSNotes.xcodeproj" \
            -scheme "FSNotes iOS" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R "build/Build/Products/Release-iphoneos/FSNotes iOS.app" Payload/
          zip -qry FSNotes-Open-Filza.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FSNotes-Open-Filza-IPA
          path: FSNotes-Open-Filza.ipa
